version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imgcls_api
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=coca_ViT-L-14
      - MODEL_PRETRAINED=mscoco_finetuned_laion2B-s13B-b90k
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - model_cache:/root/.cache/open_clip
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  model_cache:
    driver: local


