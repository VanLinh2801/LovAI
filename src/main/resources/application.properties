spring.application.name=LovAI Backend API
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.jpa.properties.hibernate.type.preferred_enum_type=postgres_enum

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Supabase config
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=${SUPABASE_BUCKET}

# Firebase config
firebase.config.path=${FIREBASE_CONFIG_PATH}

# Goong API config
goong.apiKey=${GOONG_API_KEY:}
goong.baseUrl=https://rsapi.goong.io
goong.autocompletePath=/v2/place/autocomplete
goong.placeDetailPath=/place/detail
goong.photoPath=/place/photo
goong.photoMaxWidth=400

# Places provider switch: goong | serpapi
places.provider=serpapi

# SerpAPI config
serpapi.apiKey=${SERPAPI_API_KEY:}
serpapi.baseUrl=https://serpapi.com/
serpapi.autocompletePath=/autocomplete
serpapi.placeDetailPath=/place/detail
serpapi.photoPath=/place/photo
serpapi.photoMaxWidth=400

# OpenWeather API config
openweather.apiKey=${OPEN_WEATHER_API_KEY:}
openweather.baseUrl=https://api.openweathermap.org/data/2.5